<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Navegación GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, Arial, sans-serif; background: #1a1a2e; color: #eee; }

    /* ---- Layout ---- */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ---- Search bar (top) ---- */
    #top-bar {
      flex-shrink: 0;
      background: #16213e;
      padding: 8px 10px;
      border-bottom: 1px solid #0f3460;
      z-index: 1000;
      position: relative;
    }
    #gps-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    #gps-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; flex-shrink: 0; transition: background .4s; }
    #gps-dot.ok  { background: #2ecc71; }
    #gps-dot.err { background: #e74c3c; }
    #gps-info { font-size: 12px; color: #aaa; }

    #search-row { display: flex; gap: 6px; }
    #search-input {
      flex: 1; padding: 10px 12px; border-radius: 20px;
      border: 2px solid #0f3460; background: #1a1a2e;
      color: #fff; font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    #search-input:focus { border-color: #e94560; }
    #search-btn {
      padding: 0 14px; background: #e94560; color: #fff;
      border: none; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    #search-btn:active { background: #c73652; }

    /* ---- Dropdown results ---- */
    #results-wrap {
      position: absolute; left: 10px; right: 10px; top: 100%;
      background: #16213e; border: 1px solid #0f3460; border-radius: 10px;
      overflow: hidden; z-index: 2000; display: none;
      box-shadow: 0 4px 16px #0008;
    }
    .result-item { padding: 11px 12px; border-bottom: 1px solid #0f3460; cursor: pointer; font-size: 14px; }
    .result-item:last-child { border-bottom: none; }
    .result-item:active { background: #e9456033; }
    .result-name { font-weight: bold; color: #fff; }
    .result-addr { font-size: 12px; color: #888; }
    #results-msg { padding: 11px 12px; color: #888; font-size: 14px; }

    /* ---- Map ---- */
    #map-wrap { flex: 1; position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; }

    /* ---- Instruction overlay on map ---- */
    #instr-overlay {
      position: absolute; top: 8px; left: 8px; right: 8px;
      background: #16213eee; border-radius: 12px; padding: 10px 14px;
      z-index: 900; display: none;
      border: 1px solid #0f3460;
    }
    #instr-dest  { font-size: 11px; color: #e94560; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
    #instr-row   { display: flex; align-items: center; gap: 10px; }
    #instr-icon  { font-size: 40px; color: #f39c12; line-height: 1; }
    #instr-text  { flex: 1; }
    #instr-main  { font-size: 18px; font-weight: bold; color: #fff; line-height: 1.2; }
    #instr-dist  { font-size: 26px; font-weight: bold; color: #f39c12; }
    #instr-next  { font-size: 13px; color: #888; margin-top: 6px; border-top: 1px solid #0f3460; padding-top: 6px; }
    #instr-actions { display: flex; gap: 6px; margin-top: 8px; }
    .i-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    #btn-recalc { background: #27ae60; color: #fff; }
    #btn-cancel  { background: #c0392b; color: #fff; }

    /* ---- Waiting overlay ---- */
    #wait-overlay {
      position: absolute; top: 8px; left: 8px; right: 8px;
      background: #16213eee; border-radius: 12px; padding: 12px 14px;
      z-index: 900; display: none; border: 1px solid #f39c12;
      font-size: 15px; color: #f39c12; text-align: center;
    }

    /* ---- Steps bottom sheet ---- */
    #steps-sheet {
      flex-shrink: 0; background: #16213e;
      border-top: 1px solid #0f3460; display: none;
      max-height: 38vh; overflow-y: auto;
    }
    #steps-title {
      padding: 8px 12px 4px; font-size: 11px; color: #888;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .step-row { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #0f3460; }
    .step-row:last-child { border-bottom: none; }
    .step-row.active { background: #e9456022; }
    .step-num { width: 20px; height: 20px; background: #0f3460; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; color: #aaa; }
    .step-row.active .step-num { background: #e94560; color: #fff; }
    .step-instr { flex: 1; font-size: 13px; color: #ddd; }
    .step-dist  { font-size: 12px; color: #f39c12; white-space: nowrap; }
  </style>
</head>
<body>
<div id="app">

  <!-- Top search bar -->
  <div id="top-bar">
    <div id="gps-row">
      <div id="gps-dot"></div>
      <div id="gps-info">Iniciando GPS…</div>
    </div>
    <div id="search-row">
      <input id="search-input" type="text" placeholder="¿A dónde vamos?"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="search-btn" onclick="doSearch()">Buscar</button>
    </div>
    <div id="results-wrap">
      <div id="results-msg" style="display:none"></div>
      <div id="results-list"></div>
    </div>
  </div>

  <!-- Map -->
  <div id="map-wrap">
    <div id="map"></div>

    <div id="instr-overlay">
      <div id="instr-dest"></div>
      <div id="instr-row">
        <div id="instr-icon"></div>
        <div id="instr-text">
          <div id="instr-main"></div>
          <div id="instr-dist"></div>
        </div>
      </div>
      <div id="instr-next"></div>
      <div id="instr-actions">
        <button class="i-btn" id="btn-recalc" onclick="recalculate()">Recalcular</button>
        <button class="i-btn" id="btn-cancel" onclick="cancelRoute()">Cancelar ruta</button>
      </div>
    </div>

    <div id="wait-overlay"></div>
  </div>

  <!-- Steps list -->
  <div id="steps-sheet">
    <div id="steps-title">Itinerario</div>
    <div id="steps-list"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- Map setup ----
var map = L.map("map", {zoomControl: true}).setView([-34.6, -58.4], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  maxZoom: 19
}).addTo(map);

var posMarker   = null;
var destMarker  = null;
var routeLine   = null;

var posIcon = L.divIcon({
  className: "",
  html: "<div style='width:16px;height:16px;border-radius:50%;background:#3498db;border:3px solid #fff;box-shadow:0 0 6px #0004'></div>",
  iconSize: [16, 16], iconAnchor: [8, 8]
});
var destIcon = L.divIcon({
  className: "",
  html: "<div style='font-size:28px;line-height:1;margin-top:-28px;text-shadow:0 2px 4px #0006'>📍</div>",
  iconSize: [28, 28], iconAnchor: [14, 28]
});

function setPos(lat, lon) {
  if (!posMarker) {
    posMarker = L.marker([lat, lon], {icon: posIcon, zIndexOffset: 1000}).addTo(map);
  } else {
    posMarker.setLatLng([lat, lon]);
  }
}

function setDest(lat, lon, label) {
  if (!destMarker) {
    destMarker = L.marker([lat, lon], {icon: destIcon}).addTo(map);
  } else {
    destMarker.setLatLng([lat, lon]);
  }
  destMarker.bindTooltip(label, {permanent: false, direction: "top"});
}

function drawRoute(coords) {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (!coords || !coords.length) return;
  routeLine = L.polyline(coords, {color: "#3498db", weight: 5, opacity: .8}).addTo(map);
  map.fitBounds(routeLine.getBounds(), {padding: [40, 40]});
}

// ---- GPS ----
var firstFit = true;

function setGPS(cls, msg) {
  document.getElementById("gps-dot").className = cls;
  document.getElementById("gps-info").textContent = msg;
}

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      var acc = Math.round(pos.coords.accuracy);
      setGPS("ok", lat.toFixed(5) + "  " + lon.toFixed(5) + "  ±" + acc + "m");
      setPos(lat, lon);
      if (firstFit && !routeLine) { map.setView([lat, lon], 15); firstFit = false; }
      fetch("/update_location", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({lat: lat, lon: lon})
      }).then(function(r){ return r.json(); })
        .then(function(d){ if (d.route_ready) pollStatus(); })
        .catch(function(){});
    },
    function(err) { setGPS("err", "GPS: " + err.message); },
    {enableHighAccuracy: true, maximumAge: 3000, timeout: 15000}
  );
} else {
  setGPS("err", "GPS no disponible");
}

// ---- Search ----
var searchTimer = null;
document.getElementById("search-input").addEventListener("keydown", function(e){ if(e.key==="Enter") doSearch(); });
document.getElementById("search-input").addEventListener("input", function(){
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (q.length > 3) searchTimer = setTimeout(doSearch, 600);
  else hideResults();
});

function doSearch() {
  var q = document.getElementById("search-input").value.trim();
  if (!q) return;
  hideResults();
  showMsg("Buscando…");
  fetch("/search?q=" + encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(data){
      showMsg("");
      if (!Array.isArray(data) || !data.length) { showMsg("Sin resultados"); return; }
      renderResults(data);
    })
    .catch(function(e){ showMsg("Error: " + e); });
}

function showMsg(txt) {
  var el = document.getElementById("results-msg");
  el.textContent = txt;
  el.style.display = txt ? "block" : "none";
  document.getElementById("results-wrap").style.display = "block";
  if (!txt && !document.getElementById("results-list").children.length)
    document.getElementById("results-wrap").style.display = "none";
}

function hideResults() {
  document.getElementById("results-wrap").style.display = "none";
  document.getElementById("results-list").innerHTML = "";
  document.getElementById("results-msg").style.display = "none";
}

function renderResults(items) {
  var el = document.getElementById("results-list");
  el.innerHTML = "";
  items.forEach(function(item) {
    var div = document.createElement("div");
    div.className = "result-item";
    var parts = item.label.split(",");
    var name  = parts[0].trim();
    var addr  = parts.slice(1, 3).join(",").trim();
    div.innerHTML = "<div class='result-name'>" + esc(name) + "</div>"
                  + (addr ? "<div class='result-addr'>" + esc(addr) + "</div>" : "");
    div.addEventListener("click", (function(it){ return function(){ selectDest(it); }; })(item));
    el.appendChild(div);
  });
  document.getElementById("results-wrap").style.display = "block";
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function selectDest(item) {
  hideResults();
  var name = item.label.split(",")[0].trim();
  document.getElementById("search-input").value = name;
  showWait("Calculando ruta…");

  // Preview destination on map immediately
  setDest(item.lat, item.lon, name);
  map.setView([item.lat, item.lon], 14);

  fetch("/set_destination", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({lat: item.lat, lon: item.lon, label: name})
  }).then(function(r){ return r.json(); })
    .then(function(){ hideWait(); pollStatus(); })
    .catch(function(e){ hideWait(); showWait("Error: " + e); });
}

// ---- Overlays ----
function showWait(msg) {
  document.getElementById("wait-overlay").textContent = msg;
  document.getElementById("wait-overlay").style.display = "block";
  document.getElementById("instr-overlay").style.display = "none";
}
function hideWait() {
  document.getElementById("wait-overlay").style.display = "none";
}

function recalculate() {
  showWait("Recalculando…");
  fetch("/recalculate")
    .then(function(r){ return r.json(); })
    .then(function(){ hideWait(); pollStatus(); })
    .catch(function(){ hideWait(); });
}

function cancelRoute() {
  fetch("/cancel_route").catch(function(){});
  hideWait();
  document.getElementById("instr-overlay").style.display = "none";
  document.getElementById("steps-sheet").style.display   = "none";
  document.getElementById("search-input").value = "";
  if (routeLine)  { map.removeLayer(routeLine);  routeLine  = null; }
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
}

// ---- Status polling ----
function fmtDist(m) {
  return m >= 1000 ? (m/1000).toFixed(1) + " km" : Math.round(m) + " m";
}

function pollStatus() {
  fetch("/status")
    .then(function(r){ return r.json(); })
    .then(function(d){

      // Update map layers
      if (d.lat && d.lon) setPos(d.lat, d.lon);
      if (d.dest_lat)     setDest(d.dest_lat, d.dest_lon, d.dest_label);
      if (d.route_coords && d.route_coords.length) drawRoute(d.route_coords);

      // No destination
      if (!d.dest_label) {
        hideWait();
        document.getElementById("instr-overlay").style.display = "none";
        document.getElementById("steps-sheet").style.display   = "none";
        return;
      }

      // Destination set, waiting for GPS
      if (!d.has_gps) {
        showWait("Destino guardado — esperando GPS…");
        return;
      }

      // GPS ok but no route yet
      if (d.total_steps === 0) {
        if (d.osrm_error) {
          showWait("Error al calcular ruta: " + d.osrm_error);
        } else {
          showWait("Calculando ruta…");
          fetch("/recalculate").catch(function(){});
          setTimeout(pollStatus, 2500);
        }
        return;
      }

      // Full nav state — show instruction overlay
      hideWait();
      document.getElementById("instr-dest").textContent = "▶ " + d.dest_label;
      document.getElementById("instr-icon").textContent = d.steps_list[d.step_index] ? "" : "";
      document.getElementById("instr-main").textContent = d.instruction;
      document.getElementById("instr-dist").textContent = fmtDist(d.distance_m);
      var nxt = d.steps_list[d.step_index + 1];
      document.getElementById("instr-next").textContent = nxt ? "Después: " + nxt.i : "";
      document.getElementById("instr-overlay").style.display = "block";

      // Steps sheet
      if (d.steps_list && d.steps_list.length) {
        var html = "";
        d.steps_list.forEach(function(s, i){
          var active = i === d.step_index ? " active" : "";
          html += "<div class='step-row" + active + "'>"
                + "<div class='step-num'>" + (i+1) + "</div>"
                + "<div class='step-instr'>" + esc(s.i) + "</div>"
                + "<div class='step-dist'>" + fmtDist(s.d) + "</div>"
                + "</div>";
        });
        document.getElementById("steps-list").innerHTML   = html;
        document.getElementById("steps-sheet").style.display = "block";
        var activeEl = document.querySelector(".step-row.active");
        if (activeEl) activeEl.scrollIntoView({block:"nearest"});
      }

    }).catch(function(){});
}

setInterval(pollStatus, 4000);
</script>
</body>
</html>
